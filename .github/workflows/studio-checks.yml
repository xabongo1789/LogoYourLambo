name: Studio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/stl.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source-fixtures
          path: |
            HURACAN-500-v2.html
            lambo+H.stl
            src/
            model-profile.json
          retention-days: 1
